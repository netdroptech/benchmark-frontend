<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Benchmark Pact</title>

    <!-- ── Google Translate – suppress default toolbar ── -->
    <style>
      /* Hide Google's injected top bar */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }

      /* Hide the "Translated by Google" popup badge */
      .goog-te-gadget-icon,
      .goog-logo-link,
      .goog-te-gadget span,
      #goog-gt-tt,
      .goog-te-balloon-frame { display: none !important; }

      /* Keep the hidden select wrapper invisible */
      #google_translate_element { display: none !important; }

      /* Smooth font rendering after translation */
      .translated-ltr, .translated-rtl { font-family: inherit !important; }
    </style>
  </head>
  <body>
    <!-- Hidden Google Translate mount point -->
    <div id="google_translate_element"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Google Translate widget init ── -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            autoDisplay: false,
            gaTrack: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async defer>
    </script>
    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
      var _smartsupp = _smartsupp || {};
      _smartsupp.key = '9a93c2d9febc12f8c2d06cd53962f72980fa4862';
      window.smartsupp || (function (d) {
        var s, c, o = smartsupp = function () { o._.push(arguments) }; o._ = [];
        s = d.getElementsByTagName('script')[0]; c = d.createElement('script');
        c.type = 'text/javascript'; c.charset = 'utf-8'; c.async = true;
        c.src = 'https://www.smartsuppchat.com/loader.js?'; s.parentNode.insertBefore(c, s);
      })(document);
    </script>



  </body>
</html>
